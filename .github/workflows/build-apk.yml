name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ -f ScreenTranslator-complete.zip ]; then
            echo "发现 zip，开始解压..."
            unzip -o ScreenTranslator-complete.zip
            if [ -d ScreenTranslator ]; then
              cp -a ScreenTranslator/. .
              rm -rf ScreenTranslator
            fi
            echo "解压完成"
            ls -la
          else
            echo "未找到 zip，直接使用仓库源码"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "错误：找不到 gradlew"
            ls -la
            exit 1
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Show result
        run: |
          echo "=== 生成的 APK ==="
          ls -lh app/build/outputs/apk/debug/ || true
