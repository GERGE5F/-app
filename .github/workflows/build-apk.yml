name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Unzip project
        run: |
          # 查找任何 zip 文件
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "解压: $ZIP"
            unzip -o "$ZIP"
            if [ -d ScreenTranslator ]; then
              cp -a ScreenTranslator/. .
              rm -rf ScreenTranslator
            fi
          fi
          echo "===== 当前目录 ====="
          ls -la
          echo "===== 查找 gradlew ====="
          find . -name "gradlew" | head -5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "错误：找不到 gradlew"
            find . -type f | head -50
            exit 1
          fi
        env:
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
