name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "解压: $ZIP"
            unzip -o "$ZIP"
            if [ -d ScreenTranslator ]; then
              cp -a ScreenTranslator/. .
              rm -rf ScreenTranslator
            fi
          fi
          ls -la
          find . -name "gradlew" | head -3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Build APK
        run: |
          if [ ! -f ./gradlew ]; then
            echo "找不到 gradlew，当前文件列表："
            find . -type f | head -40
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
